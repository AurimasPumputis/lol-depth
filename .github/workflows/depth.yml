name: depth snapshot

# GitHub does not honour high-frequency cron. '*/15' is a hint, and under load
# most of those triggers are dropped: in practice about one an hour arrives,
# and fewer overnight. Relying on the scheduler for density meant some series
# were only ever caught after kickoff, which is useless for the paper test.
#
# So the schedule is only a wake-up call now. Each triggered run takes its own
# snapshots, every 5 minutes for 50 minutes, and commits along the way. One
# delivered trigger produces about eleven snapshots instead of one, and the
# scheduler's jitter stops mattering. Every market inside the window is now
# caught within 5 minutes of its start time.
#
# The window is 240 minutes, not 90. Measured on 2026-07-26/27, 4 of 22 map
# markets were never seen before kickoff at all, and a map market not seen
# before kickoff can never produce a bet. The cause was not the window itself
# but gaps in the run schedule: one 489-minute hole overnight, and several
# runs that stopped after one snapshot. A wider window does not fix those
# holes, it survives them, because one surviving snapshot then covers four
# hours of upcoming kickoffs instead of one and a half.
#
# 240 was chosen by measurement, not taste. One snapshot took 59s at that
# window against roughly 30s at 90, so the loop costs about 11 minutes of work
# on top of the 50 minutes of sleep. Going wider stops fitting inside the job.
#
# Widening the window does NOT touch the frozen rule. bet_logger.py reads the
# last snapshot before kickoff; a wider window only adds earlier rows and
# leaves that one alone. It does change the sample, by rescuing markets that
# were previously missed, so the change is dated here: 2026-07-27, made when
# 5 bets were logged and none had settled.
#
# The repo is public, so Actions minutes are unmetered. If it is ever made
# private this file will burn the free allowance in about three days.
#
# Every market kind is collected, not just maps. Depth cannot be recovered
# afterwards, so the props and totals are kept even though the frozen rule
# never bets them.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:        # lets you press a button to run it by hand

permissions:
  contents: write           # needed so the job can commit the csv back

concurrency:
  group: depth-snapshot     # never let two runs commit at the same time
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Must exceed the loop below. The loop is 50 minutes of sleep plus 11
    # snapshots. At --window 240 one snapshot measured 59s off-peak, so the
    # loop is about 62 minutes including checkout and the self-test. At peak
    # hours, when the EU and Americas leagues overlap, more markets are in
    # scope and a snapshot will take longer, so the headroom here is
    # deliberate. A timeout costs nothing when the job finishes early; it only
    # bites when something hangs.
    #
    # Getting this wrong is expensive in a specific way: the kill lands at the
    # END of the loop, and the end is the snapshots closest to kickoff, which
    # are exactly the rows the frozen rule reads.
    timeout-minutes: 110

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # If the maths is broken, fail here instead of writing bad numbers.
      - name: self-test
        run: python forward/depth_snapshot.py --self-test

      - name: snapshot loop
        run: |
          set -u

          git config user.name  "depth-bot"
          git config user.email "depth-bot@users.noreply.github.com"

          # Two things append to the end of the same CSV: this run and whatever
          # else pushed while it was working. Git calls that a conflict even
          # though both sides only added lines, so depth/*.csv is set to the
          # built-in `union` merge driver in .gitattributes. Without that file
          # this function conflicts and the run dies. Check it exists.
          push_if_changed () {
            if [ -z "$(git status --porcelain depth/)" ]; then
              echo "nothing new to commit"
              return 0
            fi
            git add depth/
            git commit -m "depth $(date -u '+%Y-%m-%d %H:%M') UTC" || return 1

            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash && git push; then
                echo "pushed"
                return 0
              fi
              # A failed rebase leaves the repo mid-rebase with unmerged files,
              # and every later pull then dies with "Pulling is not possible
              # because you have unmerged files". Observed on run #25: attempt 1
              # broke the state, attempts 2 and 3 could not have worked. Retries
              # are theatre unless the state is reset first.
              git rebase --abort 2>/dev/null || true
              echo "push attempt $i failed, retrying"
              sleep $(( i * 5 ))
            done
            echo "could not push after 5 tries"
            return 1
          }

          # 11 snapshots, 5 minutes apart, committing after every second one
          # so a cancelled run never loses more than 10 minutes of data.
          #
          # Do not shorten the 300s sleep to buy time. The spacing decides how
          # close the last pre-kickoff snapshot sits to the start, currently a
          # median of 2.1 minutes, and that snapshot's price is what the
          # frozen rule records. Sleep is the one number in this file that
          # feeds the test directly.
          for i in $(seq 0 10); do
            echo "--- snapshot $i of 10 at $(date -u '+%H:%M:%S') UTC"
            python forward/depth_snapshot.py \
              --outdir depth --window 240 \
              || echo "snapshot failed, continuing"

            # `|| true` is load-bearing. GitHub runs this block with `bash -e`,
            # not plain bash, so a non-zero return from push_if_changed aborts
            # the whole step. Run #25 died at 7m55s of a 62-minute loop that
            # way, losing every remaining snapshot including the ones nearest
            # kickoff, which are the rows both frozen rules read. Nothing is
            # lost by continuing: the rows stay in the working tree and the
            # next successful commit takes them.
            if [ $(( (i + 1) % 2 )) -eq 0 ]; then
              push_if_changed || true
            fi

            if [ "$i" -lt 10 ]; then
              sleep 300
            fi
          done

          push_if_changed
