name: depth snapshot

# GitHub does not honour high-frequency cron. '*/15' is a hint, and under load
# most of those triggers are dropped: in practice about one an hour arrives,
# and fewer overnight. Relying on the scheduler for density meant some series
# were only ever caught after kickoff, which is useless for the paper test.
#
# So the schedule is only a wake-up call now. Each triggered run takes its own
# snapshots, every 5 minutes for 50 minutes, and commits along the way. One
# delivered trigger produces about eleven snapshots instead of one, and the
# scheduler's jitter stops mattering. Every market inside the 90-minute window
# is now caught within 5 minutes of its start time.
#
# The repo is public, so Actions minutes are unmetered. If it is ever made
# private this file will burn the free allowance in about three days.
#
# Every market kind is collected, not just maps. Depth cannot be recovered
# afterwards, so the props and totals are kept even though the frozen rule
# never bets them.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:        # lets you press a button to run it by hand

permissions:
  contents: write           # needed so the job can commit the csv back

concurrency:
  group: depth-snapshot     # never let two runs commit at the same time
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 70     # must exceed the 50-minute loop below

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # If the maths is broken, fail here instead of writing bad numbers.
      - name: self-test
        run: python forward/depth_snapshot.py --self-test

      - name: snapshot loop
        run: |
          set -u

          git config user.name  "depth-bot"
          git config user.email "depth-bot@users.noreply.github.com"

          push_if_changed () {
            if [ -z "$(git status --porcelain depth/)" ]; then
              echo "nothing new to commit"
              return 0
            fi
            git add depth/
            git commit -m "depth $(date -u '+%Y-%m-%d %H:%M') UTC"
            # Another run may have pushed while this one was working.
            for i in 1 2 3; do
              if git pull --rebase --autostash && git push; then
                echo "pushed"
                return 0
              fi
              echo "push attempt $i failed, retrying"
              sleep 5
            done
            echo "could not push after 3 tries"
            return 1
          }

          # 11 snapshots, 5 minutes apart, committing after every third one so
          # a cancelled run never loses more than 15 minutes of data.
          for i in $(seq 0 10); do
            echo "--- snapshot $i of 10 at $(date -u '+%H:%M:%S') UTC"
            python forward/depth_snapshot.py \
              --outdir depth --window 90 \
              || echo "snapshot failed, continuing"

            if [ $(( (i + 1) % 3 )) -eq 0 ]; then
              push_if_changed
            fi

            if [ "$i" -lt 10 ]; then
              sleep 300
            fi
          done

          push_if_changed
